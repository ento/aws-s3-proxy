name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: cachix/install-nix-action@v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: actions/checkout@v7.0.1
      - run: devenv test

  vulncheck:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  integration:
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        include:
          - image_name: aws-s3-proxy
            build_target: dist
          - image_name: aws-s3-proxy-lambda
            build_target: dist-lambda
      fail-fast: false
    steps:
      - uses: cachix/install-nix-action@v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: actions/checkout@v7.0.1
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: go-build-cache
          key: ${{ runner.os }}-go-build-cache-${{ hashFiles('**/go.sum') }}
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-dir: go-build-cache
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      - id: build_date
        name: Determine build date
        run: |
          value=$(date -u +'%Y-%m-%dT%H:%M:%Sz')
          echo "value=$value" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ matrix.image_name }}
          target: ${{ matrix.build_target }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
            BUILD_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run test
        run: devenv shell pytest integration/test.py --image ${{ matrix.image_name }}
